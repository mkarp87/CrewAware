<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CrewAware</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#10151c;--panel:#18202b;--line:#2a3544;--tx:#e6ebf2;--mut:#93a1b5;--acc:#4da3ff;
--av:#2e9e5b;--dp:#e08a00;--os:#8a5cf0;--bs:#c9a400;--off:#6b7280;--late:#f0b429;--bad:#e5484d}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,Segoe UI,Roboto,sans-serif}
body{display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);height:52px;flex:none}
header img{height:34px;max-width:140px;object-fit:contain;background:#fff;border-radius:4px;padding:2px}
header .brand{font-weight:700;font-size:18px}
header .slogan{color:var(--mut)}
header .sp{flex:1}
header input{background:#0e131a;border:1px solid var(--line);color:var(--tx);border-radius:6px;padding:5px 8px;width:140px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--bad);display:inline-block}
.dot.on{background:var(--av)}
#alerts{flex:none}
#alerts .alert{padding:6px 14px;font-size:13px;cursor:pointer;border-bottom:1px solid #0006}
#alerts .alert.warn{background:#5b4a10;color:#ffe9a8}
#alerts .alert.crit{background:#7a1f23;color:#fff;font-weight:600}
main{display:grid;grid-template-columns:1fr 400px;flex:1;min-height:0}
#mapwrap{position:relative;overflow:hidden;background:#0b0f14;touch-action:none}
#map{width:100%;height:100%;display:block;cursor:grab;user-select:none}
#map.place{cursor:crosshair}
.tools{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;max-width:60%}
#drawbar{position:absolute;left:50%;transform:translateX(-50%);bottom:56px;background:#18202bee;border:1px solid var(--acc);border-radius:8px;padding:8px 10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:92%;z-index:2}
#drawbar[hidden]{display:none}
#drawbar{pointer-events:none;background:#18202bcc}
#drawbar input,#drawbar button,#drawbar label{pointer-events:auto}
button{background:#223044;color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;font:inherit}
button:hover{background:#2a3d55}button.pri{background:var(--acc);color:#04111f;border-color:var(--acc);font-weight:600}
button.danger{border-color:#7a3035;color:#ffb4b6}
button.on{outline:2px solid var(--acc)}button:disabled{opacity:.5;cursor:not-allowed}
button.sm{padding:3px 8px;font-size:12px}
a{color:var(--acc)}
aside{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;border-radius:0;background:transparent;padding:10px;color:var(--mut)}
.tabs button.act{color:var(--tx);box-shadow:inset 0 -2px 0 var(--acc)}
.subtabs{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
.subtabs button{padding:4px 10px;font-size:13px;background:transparent;color:var(--mut)}
.subtabs button.act{color:var(--tx);border-color:var(--acc)}
.body{overflow:auto;padding:10px;flex:1}
.row{display:flex;align-items:center;gap:8px;padding:7px 6px;border-bottom:1px solid var(--line)}
.row .nm{flex:1;min-width:0}.row .sub,.sub{color:var(--mut);font-size:12px}
.chip{border-radius:10px;padding:1px 8px;font-size:12px;color:#fff;white-space:nowrap}
.chip.available{background:var(--av)}.chip.dispatched{background:var(--dp)}.chip.on_scene{background:var(--os)}
.chip.busy{background:var(--bs);color:#111}.chip.off_duty{background:var(--off)}
.ct-late{color:var(--late)}.ct-no_contact{color:var(--bad)}
select,input[type=text],input[type=number],input[type=password]{background:#0e131a;color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:4px 6px;font:inherit;min-width:0}
h3{margin:14px 0 6px;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.card{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px;background:#141b25}
.err{color:var(--bad);margin:6px 0}
.log div{padding:3px 0;border-bottom:1px solid var(--line);font-size:13px}.log time{color:var(--mut);margin-right:6px}
.log .sys b{color:var(--late)}
.grid2{display:grid;grid-template-columns:auto 1fr;gap:6px 8px;align-items:center}
.legend{position:absolute;left:10px;bottom:10px;background:#18202bdd;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;display:flex;gap:10px;flex-wrap:wrap;max-width:70%}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
@media(max-width:800px){main{grid-template-columns:1fr;grid-template-rows:55% 45%}aside{border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<header>
  <img id="logo" alt="" hidden>
  <span class="brand">CrewAware</span>
  <span class="slogan" id="slogan"></span>
  <span class="sp"></span>
  <span id="siteName" style="color:var(--mut)"></span>
  <button id="btnSound" class="sm" title="Beep when a unit working an incident loses contact">Sound off</button>
  <label>Seat <input id="seat" placeholder="your name" maxlength="40"></label>
  <span class="dot" id="conn" title="connection"></span>
</header>
<div id="alerts" hidden></div>
<main>
  <div id="mapwrap">
    <svg id="map"></svg>
    <div class="tools">
      <button id="btnPlace" class="pri">Place incident</button>
      <button id="btnFit">Fit</button>
      <button id="btnEdit" hidden title="Drag repeaters to where they stand">Edit map</button>
    </div>
    <div id="drawbar" hidden>
      <b id="drawTitle"></b><span class="sub" id="drawCount"></span>
      <input type="text" id="drawName" placeholder="name (optional)" maxlength="60" style="width:150px">
      <label id="drawFactorWrap" hidden>Speed <input type="number" id="drawFactor" value="50" min="5" max="100" style="width:60px">%</label>
      <button id="drawFinish" class="pri">Finish</button><button id="drawUndo">Undo point</button><button id="drawCancel">Cancel</button>
    </div>
    <div class="legend" id="legend"></div>
  </div>
  <aside>
    <div class="tabs" id="tabs"></div>
    <div class="body" id="body"></div>
  </aside>
</main>
<script>
"use strict";
const STATUSES=[["available","Available"],["dispatched","Dispatched"],["on_scene","On scene"],["busy","Busy"],["off_duty","Off duty"]];
const SLABEL=Object.fromEntries(STATUSES);
const SCOL={available:"#2e9e5b",dispatched:"#e08a00",on_scene:"#8a5cf0",busy:"#c9a400",off_duty:"#6b7280"};
const KINDS={wall:"Wall",gate:"Gate",no_go:"No-go area",slow:"Slow zone"};
const NS="http://www.w3.org/2000/svg";
let S=null;            // latest state: snapshot plus radio
let tab="units";
let setupTab="site";
let placing=false;
let sel=null;          // selected incident id
let cands=[];          // nearest list for selected incident
let picked=new Set();  // unit ids ticked for dispatch
let hoverUnit=null;    // unit id whose route is highlighted
let errMsg="";
let view={x:0,y:0,k:1};// pan/zoom: screen = (p*k)+x
let fitted=false;
let dragging=null;
let adminState={admin:false};
let draw=null;         // {kind, pts:[[px,py]...]} while drawing an obstacle
let editMap=false;     // admin can drag repeaters
let placeRep=null;     // repeater id waiting for a map click
let repDrag=null;      // {id,px,py,moved}
let profiles=null;     // saved sites, loaded on demand
let confirmKey=null,confirmTimer=null;
let soundOn=localStorage.getItem("crewaware.sound")==="1";
let seenCrit=new Set();
let radioSig="";

// ---------- helpers ----------
const $=id=>document.getElementById(id);
function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(k==="class")e.className=v; else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);
    else if(k==="checked"||k==="selected"||k==="value"||k==="disabled"){if(v)e[k]=v; if(k==="value"&&v!=null)e.value=v;}
    else if(v===true)e.setAttribute(k,""); else if(v!==false&&v!=null)e.setAttribute(k,v);
  }
  for(const c of kids.flat()){ if(c==null||c===false)continue; e.append(c.nodeType?c:document.createTextNode(String(c))); }
  return e;
}
function sv(tag,attrs,...kids){
  const e=document.createElementNS(NS,tag);
  for(const [k,v] of Object.entries(attrs||{}))e.setAttribute(k,v);
  for(const c of kids.flat()){ if(c==null)continue; e.append(c.nodeType?c:document.createTextNode(String(c))); }
  return e;
}
const seat=()=>$("seat").value.trim()||"unknown";
async function api(path,body,method){
  const opt={method:method||(body!==undefined?"POST":"GET"),headers:{"X-Seat":seat()}};
  if(body!==undefined&&!(body instanceof Blob)){opt.headers["Content-Type"]="application/json";opt.body=JSON.stringify(body);}
  if(body instanceof Blob)opt.body=body;
  const r=await fetch(path,opt);
  const j=await r.json().catch(()=>({}));
  if(r.status===401&&path!=="/api/admin/login"){adminState={admin:false};}
  if(!r.ok)throw new Error(j.error||r.statusText);
  return j;
}
async function act(fn){
  forceBody=true;
  try{errMsg="";await fn();}catch(e){errMsg=e.message;}
  render();
}
function fmtAge(s){
  if(s<60)return Math.round(s)+"s";
  if(s<3600)return Math.round(s/60)+" min";
  return (s/3600).toFixed(1)+" h";
}
function fmtDist(ft){return ft<1000?Math.round(ft)+" ft":(ft/5280).toFixed(2)+" mi";}
function fmtEta(sec){
  if(sec==null||!isFinite(sec))return "n/a";
  if(sec<90)return Math.round(sec)+" s";
  return Math.round(sec/60)+" min";
}
function fmtTime(t){return new Date(t).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"});}
const shortKey=k=>k?k.slice(0,8)+"…":"";
const v=id=>$(id).value;

// ---------- georeference (two anchors, no rotation) ----------
function geoOK(s){return s.b.px!==s.a.px&&s.b.py!==s.a.py&&s.b.lon!==s.a.lon&&s.b.lat!==s.a.lat;}
function toPx(s,lat,lon){
  return [s.a.px+(lon-s.a.lon)/(s.b.lon-s.a.lon)*(s.b.px-s.a.px), s.a.py+(lat-s.a.lat)/(s.b.lat-s.a.lat)*(s.b.py-s.a.py)];
}
function toLL(s,px,py){
  return [s.a.lat+(py-s.a.py)/(s.b.py-s.a.py)*(s.b.lat-s.a.lat), s.a.lon+(px-s.a.px)/(s.b.px-s.a.px)*(s.b.lon-s.a.lon)];
}

// ---------- map ----------
const map=$("map");
function mapSize(){const r=map.getBoundingClientRect();return [r.width,r.height];}
function fit(){
  if(!S)return;
  const [W,H]=mapSize(), iw=S.site.img_w||1000, ih=S.site.img_h||700;
  const k=Math.min(W/iw,H/ih)*0.96;
  view={k,x:(W-iw*k)/2,y:(H-ih*k)/2};
  fitted=true;
}
function pts2str(p){return p.map(q=>q[0]+","+q[1]).join(" ");}
function drawObstacles(g,inv){
  for(const o of S.obstacles||[]){
    const p=o.points; if(!p||p.length<2)continue;
    if(o.kind==="wall"){
      g.append(sv("polyline",{points:pts2str(p),fill:"none",stroke:"#ff6b6b","stroke-width":4*inv,"stroke-linecap":"round","stroke-linejoin":"round"}));
    }else if(o.kind==="gate"){
      g.append(sv("polyline",{points:pts2str(p),fill:"none",stroke:o.open?"#2e9e5b":"#ff9f43","stroke-width":5*inv,"stroke-dasharray":o.open?`${2*inv} ${8*inv}`:`${10*inv} ${5*inv}`,"stroke-linecap":"butt"}));
      const m=p[Math.floor(p.length/2)];
      g.append(sv("text",{x:m[0]+6*inv,y:m[1],fill:o.open?"#9be3b5":"#ffcf9e","font-size":11*inv,"paint-order":"stroke",stroke:"#000","stroke-width":3*inv},(o.name||"Gate")+(o.open?" (open)":" (closed)")));
    }else if(o.kind==="no_go"){
      g.append(sv("polygon",{points:pts2str(p),fill:"rgba(229,72,77,.28)",stroke:"#e5484d","stroke-width":2*inv}));
    }else if(o.kind==="slow"){
      g.append(sv("polygon",{points:pts2str(p),fill:"rgba(240,180,41,.22)",stroke:"#f0b429","stroke-width":2*inv,"stroke-dasharray":`${6*inv} ${4*inv}`}));
      const c=p.reduce((a,q)=>[a[0]+q[0]/p.length,a[1]+q[1]/p.length],[0,0]);
      g.append(sv("text",{x:c[0],y:c[1],fill:"#ffe9a8","font-size":11*inv,"text-anchor":"middle","paint-order":"stroke",stroke:"#000","stroke-width":3*inv},(o.name?o.name+" ":"")+Math.round(o.factor*100)+"%"));
    }
  }
}
function drawMap(){
  if(!S)return;
  const s=S.site, ok=geoOK(s);
  const g=sv("g",{transform:`translate(${view.x} ${view.y}) scale(${view.k})`});
  const iw=s.img_w||1000, ih=s.img_h||700;
  if(s.overlay){
    g.append(sv("image",{href:"/files/"+s.overlay,x:0,y:0,width:iw,height:ih,preserveAspectRatio:"none"}));
  }else{
    g.append(sv("rect",{x:0,y:0,width:iw,height:ih,fill:"#121a24",stroke:"#2a3544","stroke-width":2/view.k}));
    for(let x=100;x<iw;x+=100)g.append(sv("line",{x1:x,y1:0,x2:x,y2:ih,stroke:"#1d2836","stroke-width":1/view.k}));
    for(let y=100;y<ih;y+=100)g.append(sv("line",{x1:0,y1:y,x2:iw,y2:y,stroke:"#1d2836","stroke-width":1/view.k}));
  }
  const inv=1/view.k; // markers keep constant screen size
  drawObstacles(g,inv);
  // routes for the units ticked for dispatch, and the one under the pointer
  const showRoutes=new Set([...picked]); if(hoverUnit)showRoutes.add(hoverUnit);
  for(const c of cands){
    if(!showRoutes.has(c.unit_id)||!c.path_px||c.path_px.length<2)continue;
    g.append(sv("polyline",{points:pts2str(c.path_px),fill:"none",stroke:"#4da3ff","stroke-width":3*inv,"stroke-dasharray":`${8*inv} ${5*inv}`,"stroke-linejoin":"round"}));
  }
  if(ok){
    for(const r of S.repeaters){
      if(!r.placed)continue;
      let [x,y]=toPx(s,r.lat,r.lon);
      if(repDrag&&repDrag.id===r.id){x=repDrag.px;y=repDrag.py;}
      const col=r.contact==="normal"?"#2e9e5b":r.contact==="late"?"#f0b429":"#e5484d";
      const m=sv("g",{transform:`translate(${x} ${y}) scale(${inv})`,style:editMap&&adminState.admin?"cursor:grab":""});
      m.append(sv("polygon",{points:"0,-10 9,6 -9,6",fill:col,stroke:"#fff","stroke-width":1.5}));
      if(editMap&&adminState.admin)m.append(sv("circle",{r:16,fill:"none",stroke:"#4da3ff","stroke-width":2,"stroke-dasharray":"3 3"}));
      m.append(sv("text",{x:12,y:4,fill:"#dfe7f2","font-size":12,"paint-order":"stroke",stroke:"#000","stroke-width":3},r.name+(r.contact==="normal"?"":" ("+(r.contact==="late"?"late":"no contact")+")")));
      if(editMap&&adminState.admin){
        m.addEventListener("pointerdown",ev=>{
          ev.stopPropagation(); map.setPointerCapture(ev.pointerId);
          repDrag={id:r.id,px:x,py:y,moved:false,sx:ev.clientX,sy:ev.clientY};
        });
      }
      g.append(m);
    }
    for(const i of S.incidents){
      const [x,y]=toPx(s,i.lat,i.lon);
      const m=sv("g",{transform:`translate(${x} ${y}) scale(${inv})`,style:"cursor:pointer"});
      m.append(sv("circle",{r:13,fill:"none",stroke:i.id===sel?"#fff":"#e5484d","stroke-width":3}));
      m.append(sv("path",{d:"M-6,-6 L6,6 M6,-6 L-6,6",stroke:"#e5484d","stroke-width":3}));
      m.append(sv("text",{x:16,y:4,fill:"#ffb4b6","font-size":13,"font-weight":700,"paint-order":"stroke",stroke:"#000","stroke-width":3},i.label));
      m.addEventListener("click",ev=>{ev.stopPropagation();selectIncident(i.id);});
      g.append(m);
      // lines to dispatched units
      for(const uid of i.units||[]){
        const u=S.units.find(q=>q.id===uid); if(!u||!u.has_pos)continue;
        const [ux,uy]=toPx(s,u.lat,u.lon);
        g.append(sv("line",{x1:x,y1:y,x2:ux,y2:uy,stroke:"#e08a00","stroke-width":2*inv,"stroke-dasharray":`${6*inv} ${4*inv}`}));
      }
    }
    for(const u of S.units){
      if(!u.has_pos)continue;
      const [x,y]=toPx(s,u.lat,u.lon);
      const gray=u.contact==="no_contact";
      const fill=gray?"#4b5563":SCOL[u.status];
      const m=sv("g",{transform:`translate(${x} ${y}) scale(${inv})`,opacity:gray?0.75:1});
      if(u.contact==="late")m.append(sv("circle",{r:15,fill:"none",stroke:"#f0b429","stroke-width":3,"stroke-dasharray":"4 3"}));
      m.append(sv("circle",{r:9,fill,stroke:"#fff","stroke-width":2}));
      if(gray)m.append(sv("path",{d:"M-4,-4 L4,4 M4,-4 L-4,4",stroke:"#fff","stroke-width":2}));
      m.append(sv("text",{x:13,y:-6,fill:"#fff","font-size":12,"font-weight":600,"paint-order":"stroke",stroke:"#000","stroke-width":3},u.name));
      m.append(sv("text",{x:13,y:8,fill:"#cdd7e5","font-size":11,"paint-order":"stroke",stroke:"#000","stroke-width":3},
        SLABEL[u.status]+(u.contact==="normal"?"":" · "+(u.contact==="late"?"late ":"no contact ")+fmtAge(u.age_sec))));
      g.append(m);
    }
  }
  // the obstacle being drawn
  if(draw&&draw.pts.length){
    const closed=draw.kind==="no_go"||draw.kind==="slow";
    g.append(sv(closed&&draw.pts.length>2?"polygon":"polyline",{points:pts2str(draw.pts),fill:closed?"rgba(77,163,255,.15)":"none",stroke:"#4da3ff","stroke-width":2*inv,"stroke-dasharray":`${5*inv} ${3*inv}`}));
    for(const p of draw.pts)g.append(sv("circle",{cx:p[0],cy:p[1],r:4*inv,fill:"#4da3ff",stroke:"#fff","stroke-width":inv}));
  }
  map.replaceChildren(g);
}

map.addEventListener("wheel",ev=>{
  ev.preventDefault();
  const r=map.getBoundingClientRect(), mx=ev.clientX-r.left, my=ev.clientY-r.top;
  const f=Math.exp(-ev.deltaY*0.0015), nk=Math.min(20,Math.max(0.05,view.k*f));
  view.x=mx-(mx-view.x)*(nk/view.k); view.y=my-(my-view.y)*(nk/view.k); view.k=nk; drawMap();
},{passive:false});
function mapPx(ev){
  const r=map.getBoundingClientRect();
  return [(ev.clientX-r.left-view.x)/view.k,(ev.clientY-r.top-view.y)/view.k];
}
map.addEventListener("pointerdown",ev=>{
  if(repDrag)return;
  map.setPointerCapture(ev.pointerId);
  dragging={x:ev.clientX,y:ev.clientY,vx:view.x,vy:view.y,moved:false};
});
map.addEventListener("pointermove",ev=>{
  if(repDrag){
    if(Math.abs(ev.clientX-repDrag.sx)+Math.abs(ev.clientY-repDrag.sy)>3)repDrag.moved=true;
    if(repDrag.moved){[repDrag.px,repDrag.py]=mapPx(ev);drawMap();}
    return;
  }
  if(!dragging)return;
  const dx=ev.clientX-dragging.x, dy=ev.clientY-dragging.y;
  if(Math.abs(dx)+Math.abs(dy)>4)dragging.moved=true;
  if(dragging.moved){view.x=dragging.vx+dx; view.y=dragging.vy+dy; drawMap();}
});
map.addEventListener("pointerup",ev=>{
  if(repDrag){
    const d=repDrag; repDrag=null;
    if(d.moved&&S&&geoOK(S.site)){
      const r=S.repeaters.find(q=>q.id===d.id);
      const [lat,lon]=toLL(S.site,d.px,d.py);
      if(r)act(()=>api("/api/repeaters",{id:r.id,name:r.name,lat,lon,placed:true}));
    }else drawMap();
    return;
  }
  const d=dragging; dragging=null;
  if(!d||d.moved||!S)return;
  const [px,py]=mapPx(ev);
  if(draw){
    draw.pts.push([Math.round(px*10)/10,Math.round(py*10)/10]);
    drawBarUpdate(); drawMap(); return;
  }
  if(placeRep){
    if(!geoOK(S.site)){errMsg="Set the two overlay anchors in Setup before placing repeaters.";render();return;}
    const r=S.repeaters.find(q=>q.id===placeRep); placeRep=null;
    if(r){const [lat,lon]=toLL(S.site,px,py);act(()=>api("/api/repeaters",{id:r.id,name:r.name,lat,lon,placed:true}));}
    return;
  }
  if(!placing)return;
  if(!geoOK(S.site)){errMsg="Set the two overlay anchors in Setup before placing incidents.";render();return;}
  const [lat,lon]=toLL(S.site,px,py);
  placing=false; map.classList.remove("place"); $("btnPlace").classList.remove("on");
  act(async()=>{const inc=await api("/api/incidents",{lat,lon,label:""}); await selectIncident(inc.id,inc);});
});
$("btnPlace").onclick=()=>{
  placing=!placing; map.classList.toggle("place",placing);
  $("btnPlace").classList.toggle("on",placing);
};
$("btnFit").onclick=()=>{fit();drawMap();};
$("btnEdit").onclick=()=>{editMap=!editMap;$("btnEdit").classList.toggle("on",editMap);drawMap();};
window.addEventListener("resize",()=>{drawMap();});
window.addEventListener("keydown",ev=>{
  if(draw&&ev.key==="Escape")cancelDraw();
});

// ---------- obstacle drawing ----------
function startDraw(kind){
  draw={kind,pts:[]}; placing=false; placeRep=null;
  map.classList.add("place");
  $("drawTitle").textContent="Drawing: "+KINDS[kind];
  $("drawFactorWrap").hidden=kind!=="slow";
  $("drawName").value="";
  $("drawbar").hidden=false;
  drawBarUpdate(); drawMap();
}
function drawBarUpdate(){
  if(!draw)return;
  const need=(draw.kind==="wall"||draw.kind==="gate")?2:3;
  $("drawCount").textContent=" click the map to add points ("+draw.pts.length+", need "+need+")";
  $("drawFinish").disabled=draw.pts.length<need;
}
function cancelDraw(){
  draw=null; map.classList.remove("place"); $("drawbar").hidden=true; drawMap();
}
$("drawCancel").onclick=cancelDraw;
$("drawUndo").onclick=()=>{if(draw){draw.pts.pop();drawBarUpdate();drawMap();}};
$("drawFinish").onclick=()=>{
  if(!draw)return;
  const o={id:0,kind:draw.kind,name:$("drawName").value.trim(),points:draw.pts,open:false,factor:draw.kind==="slow"?Math.min(1,Math.max(0.05,(+$("drawFactor").value||50)/100)):1};
  cancelDraw();
  act(()=>api("/api/obstacles",o));
};

// ---------- incidents ----------
async function selectIncident(id,inc){
  sel=id; tab="incident"; picked=new Set(); cands=[]; hoverUnit=null;
  const i=inc||S.incidents.find(q=>q.id===id);
  if(i){
    try{cands=await api(`/api/nearest?lat=${i.lat}&lon=${i.lon}`);}catch(e){errMsg=e.message;}
    // pre-tick the closest live unit
    const first=cands.find(c=>c.contact!=="no_contact"); if(first)picked.add(first.unit_id);
  }
  forceBody=true; render();
}
async function refreshCands(){
  const i=S&&S.incidents.find(q=>q.id===sel); if(!i)return;
  try{cands=await api(`/api/nearest?lat=${i.lat}&lon=${i.lon}`);}catch(e){}
}

function tabsRender(){
  const t=$("tabs"); t.replaceChildren();
  for(const [id,label] of [["units","Units"],["incident","Incident"],["log","Log"],["setup","Setup"]]){
    t.append(h("button",{class:tab===id?"act":"",onclick:()=>{tab=id;forceBody=true;render();}},label));
  }
}
function readingText(r){
  if(!r.has_credentials)return "no password stored, so it is not being read";
  const rd=r.reading;
  if(!rd)return "not read yet";
  const ago=fmtAge(Math.max(0,(Date.parse(S.now)-Date.parse(rd.read_at))/1000))+" ago";
  if(!rd.ok)return "last read failed ("+rd.error+") · "+ago;
  const d=rd.data||{}, p=[];
  if(d.battery_mv!=null)p.push((d.battery_mv/1000).toFixed(2)+" V");
  if(d.noise_floor_dbm!=null)p.push("noise "+d.noise_floor_dbm+" dBm");
  if(d.last_snr_db!=null)p.push("SNR "+d.last_snr_db+" dB");
  if(d.uptime_s!=null)p.push("up "+(d.uptime_s>=86400?Math.floor(d.uptime_s/86400)+" d":Math.floor(d.uptime_s/3600)+" h"));
  return (p.length?p.join(" · ")+" · ":"")+"read "+ago;
}

function candLine(c){
  const dis=c.contact==="no_contact";
  const hasObs=(S.obstacles||[]).length>0;
  let how="";
  if(c.routed&&c.dist_m>c.straight_m*1.1)how=" by route (straight line "+fmtDist(c.straight_m*3.2808)+")";
  else if(c.routed)how=" by route";
  else if(hasObs)how=" straight line, NO ROUTE FOUND";
  return fmtDist(c.dist_ft)+how+" · ETA "+(c.routed?"":"≥ ")+fmtEta(c.eta_sec)+(dis?" · NO CONTACT, last heard "+fmtAge(c.age_sec)+" ago":c.contact==="late"?" · late "+fmtAge(c.age_sec):"");
}
function incidentPanel(){

  }

    ?"Distance and ETA follow a route around the walls, closed gates and no-go areas drawn in Setup, and slow zones count at their reduced speed. Units are ranked by ETA."

// Two-step buttons for things that are hard to undo.
function confirmBtn(key,label,confirmLabel,fn,cls){
  const armed=confirmKey===key;
  return h("button",{class:(armed?"danger on ":"")+(cls||""),onclick:()=>{
    if(!armed){confirmKey=key;clearTimeout(confirmTimer);confirmTimer=setTimeout(()=>{confirmKey=null;forceBody=true;render();},5000);forceBody=true;render();}
    else{confirmKey=null;clearTimeout(confirmTimer);fn();}
  }},armed?confirmLabel:label);
}

    h("div",{style:"margin-top:8px"},h("button",{onclick:()=>act(()=>api("/api/repeaters",{id:v("rid"),name:v("rname"),lat:+v("rlat"),lon:+v("rlon"),placed:true}))},"Save repeater"))));
  if(S.repeaters.length){
    b.append(h("h3",null,"Repeater passwords"));
    b.append(h("div",{class:"sub"},"Used to log in to a repeater so CrewAware can read it. Read-only: nothing is changed on the repeater. Stored encrypted, never shown again. Leave the box empty and press Remove to delete one."));
    if(!credSel||!S.repeaters.some(r=>r.id===credSel))credSel=S.repeaters[0].id;
    b.append(h("div",{class:"card"},h("div",{class:"grid2"},
      "Repeater",h("select",{id:"credRep",onchange:ev=>{credSel=ev.target.value;}},
        S.repeaters.map(r=>h("option",{value:r.id,selected:r.id===credSel},r.name+(r.has_credentials?" (password stored)":"")))),
      "Password",h("input",{type:"password",id:"credPw",autocomplete:"off",maxlength:128})),
      h("div",{style:"margin-top:8px;display:flex;gap:8px"},
        h("button",{class:"pri",onclick:()=>{const pw=v("credPw");if(!pw){errMsg="Type a password first.";forceBody=true;render();return;}act(()=>api(`/api/repeaters/${encodeURIComponent(v("credRep"))}/credentials`,{password:pw}));}},"Save password"),
        h("button",{onclick:()=>act(()=>api(`/api/repeaters/${encodeURIComponent(v("credRep"))}/credentials`,{password:""}))},"Remove"))));
  }
  return b;
}
let credSel=null;

function radioPanel(){
  const b=h("div"), r=S.radio||{mode:"none",discovered:[]};
  const dot=h("span",{class:"dot"+(r.connected||r.mode==="sim"?" on":""),style:"margin-right:6px"});
  b.append(h("h3",null,"Radio"));
  if(r.mode==="none"){
    b.append(h("div",{class:"card"},"No radio is configured. Set CREWAWARE_RADIO in the server's .env (a serial port such as /dev/ttyACM0, or tcp://host:port) and restart."));
    return b;
  }
  if(r.mode==="sim"){
    b.append(h("div",{class:"card"},dot,"Simulator: fake units and repeaters are generated inside the server. No radio is used."));
    return b;
  }
  const lines=[h("div",null,dot,r.connected?"Connected to ":"Not connected ",h("b",null,r.name||"")),
    h("div",{class:"sub"},[r.model,r.version].filter(Boolean).join(" ")+(r.key?" · key "+shortKey(r.key):"")),
    h("div",{class:"sub"},r.connected?(r.contacts+" nodes known"+(r.sync_age_sec!=null?" · synced "+fmtAge(r.sync_age_sec)+" ago":"")):(r.error||"waiting for the radio"))];
  b.append(h("div",{class:"card"},lines,h("div",{class:"acts"},
    h("button",{class:"sm",disabled:!r.connected,onclick:()=>act(()=>api("/api/admin/radio/advert",{}))},"Send advert"))));
  b.append(h("h3",null,"Heard on the mesh, not yet adopted"));
  b.append(h("div",{class:"sub"},"Name it and choose what it is. A unit is a vehicle carrying a tracker; a repeater stands somewhere and is read over the air."));
  if(!r.discovered.length)b.append(h("p",{class:"sub"},"Nothing new. Nodes appear here when the radio hears their adverts."));
  for(const d of r.discovered){
    const name=h("input",{type:"text",value:d.name,style:"flex:1"});
    const kind=h("select",null,[["unit","Unit"],["repeater","Repeater"]].map(([x,l])=>h("option",{value:x,selected:x===(d.kind==="repeater"?"repeater":"unit")},l)));
    const grp=h("select",null,S.groups.map(g=>h("option",{value:g.id},g.name)));
    b.append(h("div",{class:"card"},
      h("div",{class:"sub"},shortKey(d.key)+" · "+(d.kind==="room"?"room server · ":"")+(d.has_pos?"has position":"no position")+" · heard "+fmtAge(d.age_sec)+" ago"),
      h("div",{style:"display:flex;gap:6px;margin-top:6px;flex-wrap:wrap"},name,kind,grp,
        h("button",{class:"pri sm",onclick:()=>act(()=>api(`/api/admin/discovered/${d.key}/adopt`,{as:kind.value,name:name.value,group:grp.value})) },"Adopt"))));
  }
  return b;
}

function saveSite(){
  act(()=>api("/api/site",{name:v("siteNameIn"),slogan:v("sloganIn"),
    a:{px:+v("apx"),py:+v("apy"),lat:+v("alat"),lon:+v("alon")},
    b:{px:+v("bpx"),py:+v("bpy"),lat:+v("blat"),lon:+v("blon")}}));
}
// Uploads must not rebuild the Setup form, or any unsaved text the admin typed would be lost.
async function sendFile(file,kind,query){
  try{errMsg="";await api("/api/site/"+kind+query,file);}
  catch(e){errMsg=e.message;forceBody=true;render();return;}
  drawOnly();
}
function upload(file,kind){
  if(!file)return;
  if(kind==="overlay"){
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{URL.revokeObjectURL(url); fitted=false; sendFile(file,kind,`?w=${img.naturalWidth}&h=${img.naturalHeight}`);};
    img.onerror=()=>{errMsg="Could not read that image.";forceBody=true;render();};
    img.src=url;
  }else sendFile(file,kind,"");
}

// ---------- alerts ----------
function beep(){
  try{
    const ac=new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(), g=ac.createGain();
    o.type="square"; o.frequency.value=880; g.gain.value=0.08;
    o.connect(g); g.connect(ac.destination); o.start();
    setTimeout(()=>{o.frequency.value=660;},180);
    setTimeout(()=>{o.stop();ac.close();},420);
  }catch(e){}
}
function alertsRender(){
  const el=$("alerts"); el.replaceChildren();
  const list=S.alerts||[];
  el.hidden=!list.length;
  for(const a of list)el.append(h("div",{class:"alert "+a.severity,onclick:()=>{tab="units";forceBody=true;render();}},(a.severity==="crit"?"⚠ ":"")+a.text));
  const now=new Set(list.filter(a=>a.severity==="crit").map(a=>a.kind+":"+a.id));
  let fresh=false; for(const k of now)if(!seenCrit.has(k))fresh=true;
  seenCrit=now;
  if(fresh&&soundOn)beep();
}
function soundBtn(){$("btnSound").textContent=soundOn?"Sound on":"Sound off";$("btnSound").classList.toggle("on",soundOn);}
$("btnSound").onclick=()=>{soundOn=!soundOn;localStorage.setItem("crewaware.sound",soundOn?"1":"0");soundBtn();if(soundOn)beep();};

// ---------- render ----------
function header(){
  const s=S.site;
  $("siteName").textContent=s.name;
  $("slogan").textContent=s.slogan||"";
  const l=$("logo");
  if(s.logo){l.src="/files/"+s.logo;l.hidden=false;}else l.hidden=true;
  document.title=(s.name?s.name+" · ":"")+"CrewAware";
  $("btnEdit").hidden=!adminState.admin;
}
function legend(){
  const l=$("legend"); l.replaceChildren();
  for(const [k,label] of STATUSES)l.append(h("span",null,h("i",{style:"background:"+SCOL[k]}),label));
  l.append(h("span",null,h("i",{style:"background:#4b5563"}),"No contact"));
  l.append(h("span",null,"Dashed ring = late"));
}
function render(){
  if(!S)return;
  const ae=document.activeElement;
  // Don't rebuild forms while someone is typing in them.
  const typing=ae&&((ae.tagName==="INPUT"&&["text","number","password"].includes(ae.type))||ae.tagName==="SELECT")&&$("body").contains(ae);
  header(); legend(); tabsRender(); alertsRender(); soundBtn();
  if(!fitted)fit();
  drawMap();
  if(typing&&!forceBody)return;
  forceBody=false;
  const body=$("body");
  const scroll=body.scrollTop;
  body.replaceChildren();
  if(errMsg)body.append(h("div",{class:"err"},errMsg));
  body.append(tab==="units"?unitsPanel():tab==="incident"?incidentPanel():tab==="log"?logPanel():setupPanel());
  body.scrollTop=scroll;
}
let forceBody=false;

// ---------- live updates ----------
function radioSignature(){
  const r=S.radio||{};
  return [r.mode,r.connected,r.name,r.error,(r.discovered||[]).map(d=>d.key).join(",")].join("|");
}
function connect(){
  const es=new EventSource("/api/events");
  const dot=$("conn");
  es.onopen=()=>dot.classList.add("on");
  es.onerror=()=>dot.classList.remove("on");
  es.onmessage=async ev=>{
    S=JSON.parse(ev.data);
    if(tab==="incident"&&sel&&S.incidents.some(i=>i.id===sel))await refreshCands();
    // drop selection if the incident closed elsewhere
    if(sel&&!S.incidents.some(i=>i.id===sel)){sel=null;cands=[];}
    // Setup forms only rebuild on explicit actions, so typing is not interrupted. The radio list
    // is the exception, and only rebuilds when what it shows has changed.
    if(tab==="setup"&&$("body").children.length>0&&!errMsg){
      const sig=radioSignature();
      if(setupTab==="radio"&&sig!==radioSig){radioSig=sig;forceBody=true;render();return;}
      radioSig=sig;
      drawOnly();return;
    }
    render();
  };
}
function drawOnly(){header();legend();tabsRender();alertsRender();soundBtn();if(!fitted)fit();drawMap();}
$("seat").value=localStorage.getItem("crewaware.seat")||"";
$("seat").addEventListener("input",e=>localStorage.setItem("crewaware.seat",e.target.value));
api("/api/admin/me").then(m=>{adminState=m;if(S){forceBody=true;render();}}).catch(()=>{});
connect();
</script>
