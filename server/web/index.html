<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CrewAware</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#10151c;--panel:#18202b;--line:#2a3544;--tx:#e6ebf2;--mut:#93a1b5;--acc:#4da3ff;
--av:#2e9e5b;--dp:#e08a00;--os:#8a5cf0;--bs:#c9a400;--off:#6b7280;--late:#f0b429;--bad:#e5484d}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,Segoe UI,Roboto,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);height:52px}
header img{height:34px;max-width:140px;object-fit:contain;background:#fff;border-radius:4px;padding:2px}
header .brand{font-weight:700;font-size:18px}
header .slogan{color:var(--mut)}
header .sp{flex:1}
header input{background:#0e131a;border:1px solid var(--line);color:var(--tx);border-radius:6px;padding:5px 8px;width:140px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--bad);display:inline-block}
.dot.on{background:var(--av)}
main{display:grid;grid-template-columns:1fr 380px;height:calc(100% - 52px)}
#mapwrap{position:relative;overflow:hidden;background:#0b0f14;touch-action:none}
#map{width:100%;height:100%;display:block;cursor:grab}
#map.place{cursor:crosshair}
.tools{position:absolute;left:10px;top:10px;display:flex;gap:6px}
button{background:#223044;color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;font:inherit}
button:hover{background:#2a3d55}button.pri{background:var(--acc);color:#04111f;border-color:var(--acc);font-weight:600}
button.on{outline:2px solid var(--acc)}button:disabled{opacity:.5;cursor:not-allowed}
aside{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;border-radius:0;background:transparent;padding:10px;color:var(--mut)}
.tabs button.act{color:var(--tx);box-shadow:inset 0 -2px 0 var(--acc)}
.body{overflow:auto;padding:10px;flex:1}
.row{display:flex;align-items:center;gap:8px;padding:7px 6px;border-bottom:1px solid var(--line)}
.row .nm{flex:1;min-width:0}.row .sub{color:var(--mut);font-size:12px}
.chip{border-radius:10px;padding:1px 8px;font-size:12px;color:#fff;white-space:nowrap}
.chip.available{background:var(--av)}.chip.dispatched{background:var(--dp)}.chip.on_scene{background:var(--os)}
.chip.busy{background:var(--bs);color:#111}.chip.off_duty{background:var(--off)}
.ct-late{color:var(--late)}.ct-no_contact{color:var(--bad)}
select,input[type=text],input[type=number]{background:#0e131a;color:var(--tx);border:1px solid var(--line);border-radius:6px;padding:4px 6px;font:inherit}
h3{margin:14px 0 6px;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
.card{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px;background:#141b25}
.err{color:var(--bad);margin:6px 0}
.log div{padding:3px 0;border-bottom:1px solid var(--line);font-size:13px}.log time{color:var(--mut);margin-right:6px}
.grid2{display:grid;grid-template-columns:auto 1fr;gap:6px 8px;align-items:center}
.legend{position:absolute;left:10px;bottom:10px;background:#18202bdd;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;display:flex;gap:10px;flex-wrap:wrap;max-width:70%}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
@media(max-width:800px){main{grid-template-columns:1fr;grid-template-rows:55% 45%}aside{border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<header>
  <img id="logo" alt="" hidden>
  <span class="brand">CrewAware</span>
  <span class="slogan" id="slogan"></span>
  <span class="sp"></span>
  <span id="siteName" style="color:var(--mut)"></span>
  <label>Seat <input id="seat" placeholder="your name" maxlength="40"></label>
  <span class="dot" id="conn" title="connection"></span>
</header>
<main>
  <div id="mapwrap">
    <svg id="map"></svg>
    <div class="tools">
      <button id="btnPlace" class="pri">Place incident</button>
      <button id="btnFit">Fit</button>
    </div>
    <div class="legend" id="legend"></div>
  </div>
  <aside>
    <div class="tabs" id="tabs"></div>
    <div class="body" id="body"></div>
  </aside>
</main>
<script>
"use strict";
const STATUSES=[["available","Available"],["dispatched","Dispatched"],["on_scene","On scene"],["busy","Busy"],["off_duty","Off duty"]];
const SLABEL=Object.fromEntries(STATUSES);
const SCOL={available:"#2e9e5b",dispatched:"#e08a00",on_scene:"#8a5cf0",busy:"#c9a400",off_duty:"#6b7280"};
const NS="http://www.w3.org/2000/svg";
let S=null;            // latest snapshot
let tab="units";
let placing=false;
let sel=null;          // selected incident id
let cands=[];          // nearest list for selected incident
let picked=new Set();  // unit ids ticked for dispatch
let errMsg="";
let view={x:0,y:0,k:1};// pan/zoom: screen = (p*k)+x
let fitted=false;
let dragging=null;

// ---------- helpers ----------
function h(tag,attrs,...kids){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(k==="class")e.className=v; else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);
    else if(v===true)e.setAttribute(k,""); else if(v!==false&&v!=null)e.setAttribute(k,v);
  }
  for(const c of kids.flat()){ if(c==null||c===false)continue; e.append(c.nodeType?c:document.createTextNode(String(c))); }
  return e;
}
function sv(tag,attrs,...kids){
  const e=document.createElementNS(NS,tag);
  for(const [k,v] of Object.entries(attrs||{}))e.setAttribute(k,v);
  for(const c of kids.flat()){ if(c==null)continue; e.append(c.nodeType?c:document.createTextNode(String(c))); }
  return e;
}
const seat=()=>document.getElementById("seat").value.trim()||"unknown";
async function api(path,body,method){
  const opt={method:method||(body!==undefined?"POST":"GET"),headers:{"X-Seat":seat()}};
  if(body!==undefined&&!(body instanceof Blob)){opt.headers["Content-Type"]="application/json";opt.body=JSON.stringify(body);}
  if(body instanceof Blob)opt.body=body;
  const r=await fetch(path,opt);
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error||r.statusText);
  return j;
}
async function act(fn){
  try{errMsg="";await fn();}catch(e){errMsg=e.message;}
  render();
}
function fmtAge(s){
  if(s<60)return Math.round(s)+"s";
  if(s<3600)return Math.round(s/60)+" min";
  return (s/3600).toFixed(1)+" h";
}
function fmtDist(ft){return ft<1000?Math.round(ft)+" ft":(ft/5280).toFixed(2)+" mi";}
function fmtEta(sec){
  if(!isFinite(sec))return "n/a";
  if(sec<90)return Math.round(sec)+" s";
  return Math.round(sec/60)+" min";
}
function fmtTime(t){return new Date(t).toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"});}

// ---------- georeference (two anchors, no rotation) ----------
function geoOK(s){return s.b.px!==s.a.px&&s.b.py!==s.a.py&&s.b.lon!==s.a.lon&&s.b.lat!==s.a.lat;}
function toPx(s,lat,lon){
  return [s.a.px+(lon-s.a.lon)/(s.b.lon-s.a.lon)*(s.b.px-s.a.px), s.a.py+(lat-s.a.lat)/(s.b.lat-s.a.lat)*(s.b.py-s.a.py)];
}
function toLL(s,px,py){
  return [s.a.lat+(py-s.a.py)/(s.b.py-s.a.py)*(s.b.lat-s.a.lat), s.a.lon+(px-s.a.px)/(s.b.px-s.a.px)*(s.b.lon-s.a.lon)];
}

// ---------- map ----------
const map=document.getElementById("map");
function mapSize(){const r=map.getBoundingClientRect();return [r.width,r.height];}
function fit(){
  if(!S)return;
  const [W,H]=mapSize(), iw=S.site.img_w||1000, ih=S.site.img_h||700;
  const k=Math.min(W/iw,H/ih)*0.96;
  view={k,x:(W-iw*k)/2,y:(H-ih*k)/2};
  fitted=true;
}
function drawMap(){
  if(!S)return;
  const s=S.site, ok=geoOK(s);
  const g=sv("g",{transform:`translate(${view.x} ${view.y}) scale(${view.k})`});
  const iw=s.img_w||1000, ih=s.img_h||700;
  if(s.overlay){
    g.append(sv("image",{href:"/files/"+s.overlay,x:0,y:0,width:iw,height:ih,preserveAspectRatio:"none"}));
  }else{
    g.append(sv("rect",{x:0,y:0,width:iw,height:ih,fill:"#121a24",stroke:"#2a3544","stroke-width":2/view.k}));
    for(let x=100;x<iw;x+=100)g.append(sv("line",{x1:x,y1:0,x2:x,y2:ih,stroke:"#1d2836","stroke-width":1/view.k}));
    for(let y=100;y<ih;y+=100)g.append(sv("line",{x1:0,y1:y,x2:iw,y2:y,stroke:"#1d2836","stroke-width":1/view.k}));
  }
  const inv=1/view.k; // markers keep constant screen size
  if(ok){
    for(const r of S.repeaters){
      if(!r.placed)continue;
      const [x,y]=toPx(s,r.lat,r.lon);
      const col=r.contact==="normal"?"#2e9e5b":r.contact==="late"?"#f0b429":"#e5484d";
      const m=sv("g",{transform:`translate(${x} ${y}) scale(${inv})`});
      m.append(sv("polygon",{points:"0,-10 9,6 -9,6",fill:col,stroke:"#fff","stroke-width":1.5}));
      m.append(sv("text",{x:12,y:4,fill:"#dfe7f2","font-size":12},r.name+(r.contact==="normal"?"":" ("+(r.contact==="late"?"late":"no contact")+")")));
      g.append(m);
    }
    for(const i of S.incidents){
      const [x,y]=toPx(s,i.lat,i.lon);
      const m=sv("g",{transform:`translate(${x} ${y}) scale(${inv})`,style:"cursor:pointer"});
      m.append(sv("circle",{r:13,fill:"none",stroke:i.id===sel?"#fff":"#e5484d","stroke-width":3}));
      m.append(sv("path",{d:"M-6,-6 L6,6 M6,-6 L-6,6",stroke:"#e5484d","stroke-width":3}));
      m.append(sv("text",{x:16,y:4,fill:"#ffb4b6","font-size":13,"font-weight":700},i.label));
      m.addEventListener("click",ev=>{ev.stopPropagation();selectIncident(i.id);});
      g.append(m);
      // lines to dispatched units
      for(const uid of i.units||[]){
        const u=S.units.find(q=>q.id===uid); if(!u||!u.has_pos)continue;
        const [ux,uy]=toPx(s,u.lat,u.lon);
        g.append(sv("line",{x1:x,y1:y,x2:ux,y2:uy,stroke:"#e08a00","stroke-width":2*inv,"stroke-dasharray":`${6*inv} ${4*inv}`}));
      }
    }
    for(const u of S.units){
      if(!u.has_pos)continue;
      const [x,y]=toPx(s,u.lat,u.lon);
      const gray=u.contact==="no_contact";
      const fill=gray?"#4b5563":SCOL[u.status];
      const m=sv("g",{transform:`translate(${x} ${y}) scale(${inv})`,opacity:gray?0.75:1});
      if(u.contact==="late")m.append(sv("circle",{r:15,fill:"none",stroke:"#f0b429","stroke-width":3,"stroke-dasharray":"4 3"}));
      m.append(sv("circle",{r:9,fill,stroke:"#fff","stroke-width":2}));
      if(gray)m.append(sv("path",{d:"M-4,-4 L4,4 M4,-4 L-4,4",stroke:"#fff","stroke-width":2}));
      const t=sv("text",{x:13,y:-6,fill:"#fff","font-size":12,"font-weight":600,"paint-order":"stroke",stroke:"#000","stroke-width":3},u.name);
      m.append(t);
      m.append(sv("text",{x:13,y:8,fill:"#cdd7e5","font-size":11,"paint-order":"stroke",stroke:"#000","stroke-width":3},
        SLABEL[u.status]+(u.contact==="normal"?"":" · "+(u.contact==="late"?"late ":"no contact ")+fmtAge(u.age_sec))));
      g.append(m);
    }
  }
  map.replaceChildren(g);
}

map.addEventListener("wheel",ev=>{
  ev.preventDefault();
  const r=map.getBoundingClientRect(), mx=ev.clientX-r.left, my=ev.clientY-r.top;
  const f=Math.exp(-ev.deltaY*0.0015), nk=Math.min(20,Math.max(0.05,view.k*f));
  view.x=mx-(mx-view.x)*(nk/view.k); view.y=my-(my-view.y)*(nk/view.k); view.k=nk; drawMap();
},{passive:false});
map.addEventListener("pointerdown",ev=>{
  map.setPointerCapture(ev.pointerId);
  dragging={x:ev.clientX,y:ev.clientY,vx:view.x,vy:view.y,moved:false};
});
map.addEventListener("pointermove",ev=>{
  if(!dragging)return;
  const dx=ev.clientX-dragging.x, dy=ev.clientY-dragging.y;
  if(Math.abs(dx)+Math.abs(dy)>4)dragging.moved=true;
  if(dragging.moved){view.x=dragging.vx+dx; view.y=dragging.vy+dy; drawMap();}
});
map.addEventListener("pointerup",ev=>{
  const d=dragging; dragging=null;
  if(!d||d.moved||!placing||!S)return;
  if(!geoOK(S.site)){errMsg="Set the two overlay anchors in Setup before placing incidents.";render();return;}
  const r=map.getBoundingClientRect();
  const px=(ev.clientX-r.left-view.x)/view.k, py=(ev.clientY-r.top-view.y)/view.k;
  const [lat,lon]=toLL(S.site,px,py);
  placing=false; map.classList.remove("place"); document.getElementById("btnPlace").classList.remove("on");
  act(async()=>{const inc=await api("/api/incidents",{lat,lon,label:""}); await selectIncident(inc.id,inc);});
});
document.getElementById("btnPlace").onclick=()=>{
  placing=!placing; map.classList.toggle("place",placing);
  document.getElementById("btnPlace").classList.toggle("on",placing);
};
document.getElementById("btnFit").onclick=()=>{fit();drawMap();};
window.addEventListener("resize",()=>{drawMap();});

// ---------- incidents ----------
async function selectIncident(id,inc){
  sel=id; tab="incident"; picked=new Set(); cands=[];
  const i=inc||S.incidents.find(q=>q.id===id);
  if(i){
    try{cands=await api(`/api/nearest?lat=${i.lat}&lon=${i.lon}`);}catch(e){errMsg=e.message;}
    // pre-tick the closest live unit
    const first=cands.find(c=>c.contact!=="no_contact"); if(first)picked.add(first.unit_id);
  }
  forceBody=true; render();
}
async function refreshCands(){
  const i=S&&S.incidents.find(q=>q.id===sel); if(!i)return;
  try{cands=await api(`/api/nearest?lat=${i.lat}&lon=${i.lon}`);}catch(e){}
}

// ---------- panels ----------
function tabsRender(){
  const t=document.getElementById("tabs"); t.replaceChildren();
  for(const [id,label] of [["units","Units"],["incident","Incident"],["log","Log"],["setup","Setup"]]){
    t.append(h("button",{class:tab===id?"act":"",onclick:()=>{tab=id;render();}},label));
  }
}
function unitsPanel(){
  const b=h("div");
  for(const u of S.units){
    const sel_=h("select",{onchange:ev=>act(()=>api(`/api/units/${encodeURIComponent(u.id)}/status`,{status:ev.target.value}))},
      STATUSES.map(([v,l])=>h("option",{value:v,selected:u.status===v},l)));
    const cls=u.contact==="normal"?"":" ct-"+u.contact;
    const sub=!u.has_pos?"no position yet":
      (u.contact==="normal"?"":(u.contact==="late"?"late · ":"no contact · "))+"last heard "+fmtAge(u.age_sec)+" ago · "+u.speed_mph.toFixed(0)+" mph"+(u.battery>=0?" · "+u.battery+"%":"");
    b.append(h("div",{class:"row"},
      h("div",{class:"nm"},h("div",null,u.name," ",h("span",{class:"sub"},"("+u.group_name+")")),h("div",{class:"sub"+cls},sub)),
      sel_));
  }
  const rp=S.repeaters.length?[h("h3",null,"Repeaters")]:[];
  for(const r of S.repeaters){
    rp.push(h("div",{class:"row"},h("div",{class:"nm"},h("div",null,r.name),
      h("div",{class:"sub ct-"+r.contact},r.contact==="no_contact"?"no contact":(r.contact==="late"?"late · ":"ok · ")+fmtAge(r.age_sec)+" ago"+(r.placed?"":" · not placed"))),
      h("span",{class:"chip",style:"background:"+(r.contact==="normal"?"#2e9e5b":r.contact==="late"?"#c9a400":"#e5484d")},r.contact==="normal"?"OK":r.contact==="late"?"Late":"Down")));
  }
  b.append(...rp);
  return b;
}
function incidentPanel(){
  const b=h("div");
  if(!S.incidents.length){
    b.append(h("p",{class:"sub"},"No open incidents. Click Place incident, then click the map."));
    return b;
  }
  b.append(h("div",null,S.incidents.map(i=>h("button",{class:i.id===sel?"on":"",style:"margin:0 6px 6px 0",onclick:()=>selectIncident(i.id)},i.label))));
  const i=S.incidents.find(q=>q.id===sel);
  if(!i){b.append(h("p",{class:"sub"},"Select an incident."));return b;}
  b.append(h("div",{class:"card"},
    h("div",null,h("b",null,i.label)),
    h("div",{class:"sub"},"Opened "+fmtTime(i.opened)+" by "+i.opened_by)));
  if(i.units&&i.units.length){
    b.append(h("h3",null,"Assigned"));
    for(const uid of i.units){
      const u=S.units.find(q=>q.id===uid); if(!u)continue;
      b.append(h("div",{class:"row"},h("div",{class:"nm"},u.name),h("span",{class:"chip "+u.status},SLABEL[u.status]),
        u.status==="dispatched"?h("button",{onclick:()=>act(()=>api(`/api/incidents/${i.id}/arrive`,{unit:u.id}))},"On scene"):null));
    }
  }
  b.append(h("h3",null,"Nearest available"));
  if(!cands.length)b.append(h("p",{class:"sub"},"No available units with a position."));
  for(const c of cands){
    const dis=c.contact==="no_contact";
    b.append(h("label",{class:"row",style:"cursor:pointer"},
      h("input",{type:"checkbox",checked:picked.has(c.unit_id),onchange:ev=>{ev.target.checked?picked.add(c.unit_id):picked.delete(c.unit_id);renderDispatchBtn();}}),
      h("div",{class:"nm"},h("div",null,c.name," ",h("span",{class:"sub"},"("+c.group+")")),
        h("div",{class:"sub"+(dis?" ct-no_contact":c.contact==="late"?" ct-late":"")},
          fmtDist(c.dist_ft)+" · ETA ≥ "+fmtEta(c.eta_sec)+(dis?" · NO CONTACT, last heard "+fmtAge(c.age_sec)+" ago":c.contact==="late"?" · late "+fmtAge(c.age_sec):"")))));
  }
  b.append(h("div",{class:"sub",style:"margin:6px 0"},"ETA is straight-line at the group's speed. It ignores walls and obstacles until routing is added."));
  b.append(h("div",{style:"display:flex;gap:8px"},
    h("button",{class:"pri",id:"btnDispatch",onclick:()=>act(async()=>{
      await api(`/api/incidents/${i.id}/dispatch`,{units:[...picked]}); picked=new Set(); await refreshCands();
    })},"Dispatch"),
    h("button",{onclick:()=>act(async()=>{await api(`/api/incidents/${i.id}/close`,{}); sel=null; cands=[];})},"Close incident")));
  setTimeout(renderDispatchBtn,0);
  return b;
}
function renderDispatchBtn(){
  const b=document.getElementById("btnDispatch"); if(!b)return;
  b.disabled=picked.size===0; b.textContent=picked.size>1?`Dispatch ${picked.size} units`:"Dispatch";
}
function logPanel(){
  const d=h("div",{class:"log"});
  for(const l of S.log)d.append(h("div",null,h("time",null,fmtTime(l.t)),h("b",null,l.seat+": "),l.text));
  if(!S.log.length)d.append(h("p",{class:"sub"},"Nothing yet."));
  return d;
}
function setupPanel(){
  const s=S.site, b=h("div");
  const num=(id,v)=>h("input",{type:"number",step:"any",id,value:v,style:"width:100%"});
  b.append(h("h3",null,"Site"));
  b.append(h("div",{class:"card"},h("div",{class:"grid2"},
    "Name",h("input",{type:"text",id:"siteNameIn",value:s.name}),
    "Slogan",h("input",{type:"text",id:"sloganIn",value:s.slogan||"",maxlength:60,placeholder:"up to 60 characters"})),
    h("div",{style:"margin-top:8px"},"Logo: ",h("input",{type:"file",accept:"image/png,image/jpeg,image/gif,image/webp",onchange:ev=>upload(ev.target.files[0],"logo")})),
    h("div",{style:"margin-top:8px"},"Overlay image: ",h("input",{type:"file",accept:"image/png,image/jpeg,image/gif,image/webp",onchange:ev=>upload(ev.target.files[0],"overlay")}))));
  b.append(h("h3",null,"Overlay anchors"));
  b.append(h("div",{class:"sub"},"Two points that you know on both the image and the ground: A near the top left, B near the bottom right. Pixel values are in the image's own pixels. The overlay must be north-up."));
  b.append(h("div",{class:"card"},h("div",{class:"grid2"},
    "Image size",h("span",null,(s.img_w||0)+" × "+(s.img_h||0)+" px"),
    "A pixel x,y",h("span",{style:"display:flex;gap:4px"},num("apx",s.a.px),num("apy",s.a.py)),
    "A lat,lon",h("span",{style:"display:flex;gap:4px"},num("alat",s.a.lat),num("alon",s.a.lon)),
    "B pixel x,y",h("span",{style:"display:flex;gap:4px"},num("bpx",s.b.px),num("bpy",s.b.py)),
    "B lat,lon",h("span",{style:"display:flex;gap:4px"},num("blat",s.b.lat),num("blon",s.b.lon))),
    h("div",{style:"margin-top:8px"},h("button",{class:"pri",onclick:saveSite},"Save site"))));
  b.append(h("h3",null,"Vehicle groups (max speed)"));
  for(const g of S.groups){
    b.append(h("div",{class:"row"},h("div",{class:"nm"},g.name),h("span",{class:"sub"},g.max_mph+" mph × "+g.adjust)));
  }
  b.append(h("div",{class:"card"},h("div",{class:"grid2"},
    "Group id",h("input",{type:"text",id:"gid",placeholder:"e.g. gator"}),
    "Name",h("input",{type:"text",id:"gname"}),
    "Max mph",num("gmph",15),"Adjust ×",num("gadj",0.8)),
    h("div",{style:"margin-top:8px"},h("button",{onclick:()=>act(()=>api("/api/groups",{id:v("gid"),name:v("gname")||v("gid"),max_mph:+v("gmph"),adjust:+v("gadj")}))},"Add / update group"))));
  b.append(h("h3",null,"Add unit"));
  b.append(h("div",{class:"card"},h("div",{class:"grid2"},
    "Unit id",h("input",{type:"text",id:"uid",placeholder:"radio/contact id"}),
    "Name",h("input",{type:"text",id:"uname"}),
    "Group",h("select",{id:"ugrp"},S.groups.map(g=>h("option",{value:g.id},g.name)))),
    h("div",{style:"margin-top:8px"},h("button",{onclick:()=>act(()=>api("/api/units",{id:v("uid"),name:v("uname"),group:v("ugrp")}))},"Add unit"))));
  b.append(h("h3",null,"Add or move repeater"));
  b.append(h("div",{class:"card"},h("div",{class:"grid2"},
    "Id",h("input",{type:"text",id:"rid"}),"Name",h("input",{type:"text",id:"rname"}),
    "Lat",num("rlat",s.a.lat),"Lon",num("rlon",s.a.lon)),
    h("div",{style:"margin-top:8px"},h("button",{onclick:()=>act(()=>api("/api/repeaters",{id:v("rid"),name:v("rname"),lat:+v("rlat"),lon:+v("rlon"),placed:true,status:"unknown"}))},"Save repeater"))));
  return b;
}
const v=id=>document.getElementById(id).value;
function saveSite(){
  act(()=>api("/api/site",{name:v("siteNameIn"),slogan:v("sloganIn"),
    a:{px:+v("apx"),py:+v("apy"),lat:+v("alat"),lon:+v("alon")},
    b:{px:+v("bpx"),py:+v("bpy"),lat:+v("blat"),lon:+v("blon")}}));
}
function upload(file,kind){
  if(!file)return;
  const finish=(q)=>act(()=>api("/api/site/"+kind+q,file));
  if(kind==="overlay"){
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{URL.revokeObjectURL(url); fitted=false; finish(`?w=${img.naturalWidth}&h=${img.naturalHeight}`);};
    img.onerror=()=>{errMsg="Could not read that image.";render();};
    img.src=url;
  }else finish("");
}

// ---------- render ----------
function header(){
  const s=S.site;
  document.getElementById("siteName").textContent=s.name;
  document.getElementById("slogan").textContent=s.slogan||"";
  const l=document.getElementById("logo");
  if(s.logo){l.src="/files/"+s.logo;l.hidden=false;}else l.hidden=true;
  document.title=(s.name?s.name+" · ":"")+"CrewAware";
}
function legend(){
  const l=document.getElementById("legend"); l.replaceChildren();
  for(const [k,label] of STATUSES)l.append(h("span",null,h("i",{style:"background:"+SCOL[k]}),label));
  l.append(h("span",null,h("i",{style:"background:#4b5563"}),"No contact"));
  l.append(h("span",null,"Dashed ring = late"));
}
let focusId=null;
function render(){
  if(!S)return;
  const ae=document.activeElement;
  // Don't rebuild forms while someone is typing in them.
  const typing=ae&&((ae.tagName==="INPUT"&&["text","number"].includes(ae.type))||ae.tagName==="SELECT")&&document.getElementById("body").contains(ae);
  header(); legend(); tabsRender();
  if(!fitted)fit();
  drawMap();
  if(typing&&!forceBody)return;
  forceBody=false;
  const body=document.getElementById("body");
  const scroll=body.scrollTop;
  body.replaceChildren();
  if(errMsg)body.append(h("div",{class:"err"},errMsg));
  body.append(tab==="units"?unitsPanel():tab==="incident"?incidentPanel():tab==="log"?logPanel():setupPanel());
  body.scrollTop=scroll;
}
let forceBody=false;

// ---------- live updates ----------
function connect(){
  const es=new EventSource("/api/events");
  const dot=document.getElementById("conn");
  es.onopen=()=>dot.classList.add("on");
  es.onerror=()=>dot.classList.remove("on");
  es.onmessage=async ev=>{
    S=JSON.parse(ev.data);
    if(tab==="incident"&&sel&&S.incidents.some(i=>i.id===sel))await refreshCands();
    // drop selection if the incident closed elsewhere
    if(sel&&!S.incidents.some(i=>i.id===sel)){sel=null;cands=[];}
    // setup forms only rebuild on explicit actions, so typing is not interrupted
    if(tab==="setup"&&document.getElementById("body").children.length>0&&!errMsg){drawOnly();return;}
    render();
  };
}
function drawOnly(){header();legend();tabsRender();if(!fitted)fit();drawMap();}
document.getElementById("seat").value=localStorage.getItem("crewaware.seat")||"";
document.getElementById("seat").addEventListener("input",e=>localStorage.setItem("crewaware.seat",e.target.value));
// After an action in Setup, rebuild the form so saved values show.
const _act=act;
act=async function(fn){forceBody=true;await _act(fn);};
connect();
</script>
